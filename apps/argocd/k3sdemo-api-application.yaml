apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: k3sdemo-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/della11/k3s-lab.git
    targetRevision: main
    path: apps/k3sdemo-api

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
